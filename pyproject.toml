[project]
name = "qrt"
version = "0.1.0"
description = "Quant Red Team: a ground-truth benchmark of which audits catch which kinds of fake trading edge"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: statistical calibration tests (minutes); run with -m slow"]
